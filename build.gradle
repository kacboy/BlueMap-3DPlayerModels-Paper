plugins {
    id 'java'
}

group = 'dev.kacboy'
version = '0.3.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.bluecolored.de/releases' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.2-R0.1-SNAPSHOT'
    compileOnly 'de.bluecolored:bluemap-api:2.8.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

jar {
    archiveBaseName = 'BlueMapPlayerModelsPaper'
}
